name: Publish portable release

on:
  workflow_dispatch:
  create:

permissions:
  contents: write

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/release/v'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libasound2 libgbm1 libatomic1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libcups2
          npm ci
      - name: Validate and build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Download Electron distributions
        run: |
          set -euo pipefail
          electron_version=$(node -p 'require("./package.json").devDependencies.electron')
          mkdir -p "$RUNNER_TEMP/electron"
          base="https://github.com/electron/electron/releases/download/v$electron_version"
          for file in SHASUMS256.txt "electron-v$electron_version-win32-x64.zip" "electron-v$electron_version-linux-x64.zip"; do
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/electron/$file" "$base/$file"
          done
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_NAME" == release/* && "$GITHUB_REF_NAME" != "release/$tag" ]]; then
            echo "Release branch must be named release/$tag" >&2
            exit 1
          fi
          output="$RUNNER_TEMP/release"
          bash tools/package.sh "$RUNNER_TEMP/electron" "$output"
          cd "$output"
          win="ATE_Studio_v${version}_Windows_x64.zip"
          linux="ATE_Studio_v${version}_Linux_x64.tar.gz"
          checks="ATE_Studio_v${version}_SHA256SUMS.txt"
          unzip -tq "$win"
          check_dir="$(mktemp -d)"
          tar -xzf "$linux" -C "$check_dir"
          "$check_dir/ATE_Studio/ate-studio" --check
          test -s "$check_dir/ATE_Studio/linux-libs/libgtk-3.so.0"
          test -s "$check_dir/ATE_Studio/LINUX-LIBRARIES.tsv"
          sha256sum "$win" "$linux" > "$checks"
          gh release create "$tag" "$win" "$linux" "$checks" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ATE Studio $tag" --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
